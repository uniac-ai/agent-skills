name: re-vendor uniac.ai

# uniac.ai serves agents/agents.md vendored into the UniacWeb build: the
# Pages project watches UniacWeb's `release` branch and re-fetches this
# repository's main at every build. This repository is therefore a build
# input of a pipeline it does not live in — a change to the served
# document here produces no build there on its own. This workflow is the
# missing trigger: when the document changes on main (or on demand), it
# POSTs the uniac.ai Pages deploy hook and the rebuild re-vendors main.
#
# The hook URLs are Cloudflare Pages deploy hooks, created in the Pages
# dashboard and stored as repository secrets — one per environment's
# domain-owning project (each hook is bound to a project and branch;
# both projects build UniacWeb, whose build fetches this repository):
#   UNIAC_AI_PAGES_DEPLOY_HOOK      — prod project, `release` branch
#   UNIAC_AI_DEV_PAGES_DEPLOY_HOOK  — dev project, `main` branch
# Each is optional: an unset one warns and is skipped — that
# environment then re-vendors with its next UniacWeb build instead.

on:
  push:
    branches: [main]
    paths:
      - "agents/agents.md"
  workflow_dispatch:

concurrency:
  group: revendor-web
  cancel-in-progress: false

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: POST the Pages deploy hooks
        env:
          PROD_HOOK: ${{ secrets.UNIAC_AI_PAGES_DEPLOY_HOOK }}
          DEV_HOOK: ${{ secrets.UNIAC_AI_DEV_PAGES_DEPLOY_HOOK }}
        run: |
          fired=0
          if [ -n "$PROD_HOOK" ]; then
            curl -fsS -X POST "$PROD_HOOK" >/dev/null
            echo "prod rebuild triggered — uniac.ai re-vendors agents/agents.md from main"
            fired=1
          else
            echo "::warning::UNIAC_AI_PAGES_DEPLOY_HOOK is not set — uniac.ai stays on its last vendored copy until the next UniacWeb release build"
          fi
          if [ -n "$DEV_HOOK" ]; then
            curl -fsS -X POST "$DEV_HOOK" >/dev/null
            echo "dev rebuild triggered — the dev domain re-vendors agents/agents.md from main"
            fired=1
          else
            echo "::warning::UNIAC_AI_DEV_PAGES_DEPLOY_HOOK is not set — the dev domain stays on its last vendored copy until its next UniacWeb build"
          fi
          [ "$fired" = "1" ] || echo "::warning::no hook secret is set; nothing was triggered"
