name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the validator
        run: python3 -B -m unittest discover -s tools -p 'test_*.py'
      - name: Validate frontmatter, links and docs URLs
        run: python3 -B tools/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Skills resolve through the ecosystem installer
        # Strip colour escapes before matching the discovered skill count
        # and names against the source directories.
        run: |
          npx -y skills@1.5.15 add . --list 2>&1 | sed $'s/\e\\[[0-9;]*[A-Za-z]//g' | tee /tmp/skills.out
          skill_files=(skills/*/SKILL.md)
          grep -q "Found ${#skill_files[@]} skill" /tmp/skills.out
          for path in "${skill_files[@]}"; do
            name="${path#skills/}"
            name="${name%/SKILL.md}"
            grep -Eq "^[[:space:]]*│[[:space:]]+$name[[:space:]]*$" /tmp/skills.out
          done
