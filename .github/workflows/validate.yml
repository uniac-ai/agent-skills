name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Markdown link validation
        run: python3 -B -m unittest discover -s tools -p 'test_*.py'
      - name: Validate skill frontmatter and links
        run: python3 tools/validate.py
      - name: Generated manifests and discovery index are current
        run: python3 tools/generate_manifests.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Skills resolve through the ecosystem installer
        # The installer colourises its output, so the count arrives as
        # "Found \e[32m1\e[39m skill". Escape sequences come out before
        # the count is matched.
        run: |
          npx -y skills@1.5.15 add . --list 2>&1 | sed $'s/\e\\[[0-9;]*[A-Za-z]//g' | tee /tmp/skills.out
          grep -q "Found 1 skill" /tmp/skills.out
